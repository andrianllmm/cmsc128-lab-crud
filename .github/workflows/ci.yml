name: CI

on:
  push:
    branches: [main, act2-accounts, act3-ubac, act4-refactor]
  # Every PR, including ones stacked on other feature branches
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm --filter backend typecheck

      # Download the in-memory MongoDB binary once, so the test files running
      # in parallel don't all race to download it to the same path
      - run: pnpm --filter backend exec node --input-type=module -e "import { MongoBinary } from 'mongodb-memory-server'; await MongoBinary.getPath();"

      - run: pnpm --filter backend test

      - run: pnpm --filter frontend build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so secrets in old commits are caught too
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
